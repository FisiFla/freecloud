# C2 — All-in-one localhost compose (no TLS, no required env).
#
# Bring up with:
#   docker compose -f docker/docker-compose.localhost.yml up --build
#   or: make localhost-up
#
# Then open http://localhost:3000.
#
# How secrets work (C1):
#   `secrets-init` runs first and writes .secrets/secrets.env on first boot,
#   then exits (idempotent — skips generation if the file already exists).
#   All services that need those secrets load the file via env_file
#   (required: false so `docker compose config` passes before first run).
#   Delete .secrets/secrets.env to rotate all generated tokens.
#
# Internal credentials (postgres password, Keycloak admin password) are fixed
# to localhost-only values that compose can safely interpolate in URL strings.
# They are unreachable outside the Docker bridge network.
#
# URL layout:
#   http://localhost:3000   — dashboard (frontend)
#   http://localhost:8080   — backend API
#   http://localhost:8081   — Keycloak admin / OIDC
#   http://localhost:8082   — FleetDM mock
#
# OIDC issuer note (split-horizon — all three legs are required, and
# scripts/check-localhost-issuer.sh guards the invariant in CI):
#   Tokens carry iss=http://localhost:8081/realms/freecloud
#   (URL-form KC_HOSTNAME, which pins it) because the BROWSER must reach the issuer
#   for the authorize redirect. But "localhost" inside a container is
#   the container itself, so server-side callers split off it:
#   - frontend reaches Keycloak server-side via
#     AUTH_KEYCLOAK_INTERNAL_URL=http://keycloak:8080 (fetch rewrite
#     in lib/keycloak.ts; issuer string stays public for iss checks)
#   - backend validates iss against KEYCLOAK_ISSUER_URL=
#     http://localhost:8081 while fetching JWKS/Admin over the
#     internal KEYCLOAK_URL=http://keycloak:8080
#   Prod needs none of this: one public KC_PUBLIC_URL is resolvable
#   from browsers and containers alike.

services:

  # ── Secret generation (C1) ────────────────────────────────────────────────
  secrets-init:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662  # busybox 1.36
    # Run as the host user so the generated 0600 files stay owned by (and
    # readable by) the operator. FREECLOUD_UID/FREECLOUD_GID are exported by
    # the Makefile; a plain `docker compose up` leaves them at 0 (root).
    user: "${FREECLOUD_UID:-0}:${FREECLOUD_GID:-0}"
    volumes:
      - ../.secrets:/run/freecloud
      - ./init-secrets/generate.sh:/generate.sh:ro
    entrypoint: ["/bin/sh", "/generate.sh"]
    restart: "no"

  # ── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea  # postgres 16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freecloud
      POSTGRES_PASSWORD: freecloud-local
      POSTGRES_DB: freecloud
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freecloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    build:
      context: ..
      dockerfile: docker/Dockerfile.keycloak
    restart: unless-stopped
    command: start-dev
    env_file:
      - path: ../.secrets/secrets.env
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_DATABASE: keycloak
      KC_DB_USERNAME: freecloud
      KC_DB_PASSWORD: freecloud-local
      # URL form (not hostname+KC_HOSTNAME_PORT): the v1 two-var form
      # leaves the issuer REQUEST-derived in start-dev, so a discovery
      # fetch over the internal http://keycloak:8080 returns
      # iss=http://localhost:8080/... and Auth.js rejects it as a
      # mismatched issuer. The URL form pins iss + every endpoint to
      # the public origin no matter which path served the request.
      KC_HOSTNAME: http://localhost:8081
      ACCESS_EVAL_URL: http://backend:8080/api/v1/access/evaluate
      # ACCESS_EVAL_TOKEN: injected from .secrets/secrets.env
      POSTURE_CHECK_ENABLED: "false"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis (B1, v1.7 HA) ───────────────────────────────────────────────────
  # Dedicated to the backend's rate limiter — not shared with Fleet or anything
  # else, so a future Fleet-adjacent cache doesn't silently share this budget.
  # Turnkey requirement: no persistence/auth needed for a single-box localhost
  # stack; REDIS_URL is fixed since it never leaves the Docker bridge network.
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499  # redis 7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FleetDM mock ──────────────────────────────────────────────────────────
  fleetdm-mock:
    build:
      context: ./fleetdm-mock
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.secrets/secrets.env
        required: false
    environment:
      BACKEND_URL: http://backend:8080
      # FLEET_WEBHOOK_SECRET: injected from .secrets/secrets.env
    ports:
      - "8082:8080"
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  # ── Migrate (B2, v1.7 HA) ─────────────────────────────────────────────────
  # One-shot job: applies pending schema migrations then exits. The backend
  # waits for this to complete successfully before starting, so migrations
  # never race against server startup (or against each other, if this stack
  # is ever scaled to multiple backend replicas).
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://freecloud:freecloud-local@postgres:5432/freecloud?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.secrets/secrets.env
        required: false
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://freecloud:freecloud-local@postgres:5432/freecloud?sslmode=disable
      # B1: rate limiter — dedicated Redis on the compose bridge network.
      REDIS_URL: redis://redis:6379/0
      KC_BOOTSTRAP_ADMIN: admin
      KC_BOOTSTRAP_PASSWORD: admin-local
      # Internal URL for bootstrap/JWKS/Admin calls. Tokens carry the
      # PUBLIC issuer (http://localhost:8081/realms/freecloud, from
      # KC_HOSTNAME), so issuer validation needs the override below —
      # without it every browser-issued token is a 401 "invalid issuer".
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: http://localhost:8081
      KEYCLOAK_REALM: freecloud
      KEYCLOAK_CLIENT_ID: freecloud-service
      KEYCLOAK_AUDIENCE: freecloud-dashboard
      # KEYCLOAK_CLIENT_SECRET: self-managed by Epic A bootstrap.
      FLEET_URL: http://fleetdm-mock:8080
      # FLEET_API_TOKEN not validated in APP_ENV=development.
      FLEET_API_TOKEN: localhost-dev-fleet-token
      # FLEET_WEBHOOK_SECRET, SCIM_BEARER_TOKEN, ACCESS_EVAL_TOKEN: from secrets.env
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      fleetdm-mock:
        condition: service_started

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    env_file:
      - path: ../.secrets/secrets.env
        required: false
    environment:
      # NODE_ENV=development so requiredProdEnv() uses safe fallbacks instead of
      # throwing for optional secrets (AUTH_KEYCLOAK_SECRET for the public client).
      NODE_ENV: development
      AUTH_URL: http://localhost:3000
      # AUTH_SECRET: injected from .secrets/secrets.env (requiredEnv, always enforced).
      AUTH_KEYCLOAK_ID: freecloud-dashboard
      # Dashboard client is public (PKCE flow, no client secret).
      AUTH_KEYCLOAK_SECRET: ""
      AUTH_KEYCLOAK_ISSUER: http://localhost:8081/realms/freecloud
      # Server-side OIDC calls (discovery/token/JWKS/refresh) cannot use
      # the public issuer above — localhost inside this container is the
      # container itself. lib/keycloak.ts rewrites them to this internal
      # origin; the browser keeps using the public issuer.
      AUTH_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      # Middleware's server-side setup-status fetch must reach the backend at its
      # in-container address; NEXT_PUBLIC_API_URL (localhost:8080) only works from
      # the browser. Without this the check fails-open and /setup redirects away.
      INTERNAL_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

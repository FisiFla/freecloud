groups:
  - name: freecloud.backend
    rules:

      # ── Availability ───────────────────────────────────────────────────────

      - alert: BackendDown
        expr: absent(up{job="freecloud-backend"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FreeCloud backend is unreachable"
          description: >
            Prometheus has not received a scrape from the freecloud-backend
            job for more than 1 minute. The process may have crashed or the
            network path is broken.

      - alert: ReadyzDown
        expr: probe_success{job="freecloud-backend", instance="/readyz"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FreeCloud readiness probe is failing"
          description: >
            /readyz has returned a non-2xx for 2 minutes — the database or
            Keycloak is unreachable. Check backend logs and dependency health.

      # ── Error rate ─────────────────────────────────────────────────────────

      - alert: HighErrorRate
        expr: >
          (
            sum(rate(http_requests_total{job="freecloud-backend",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="freecloud-backend"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FreeCloud 5xx error rate above 5%"
          description: >
            More than 5% of HTTP requests are returning 5xx over the last
            5 minutes. Check backend logs for root cause.

      - alert: CriticalErrorRate
        expr: >
          (
            sum(rate(http_requests_total{job="freecloud-backend",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="freecloud-backend"}[5m]))
          ) > 0.25
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FreeCloud 5xx error rate above 25% — service degraded"
          description: >
            More than 25% of HTTP requests are returning 5xx. The service is
            largely broken; escalate immediately.

      # ── Latency ───────────────────────────────────────────────────────────

      - alert: HighP99Latency
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job="freecloud-backend"}[5m]))
            by (le, route)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FreeCloud P99 latency above 2s on {{ $labels.route }}"
          description: >
            The 99th-percentile response time for {{ $labels.route }} is above
            2 seconds over the last 5 minutes.

      # ── Reconciliation drift ───────────────────────────────────────────────

      - alert: ReconciliationDriftKeycloak
        expr: freecloud_reconcile_orphans_in_keycloak > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} Keycloak users have no local DB record"
          description: >
            The reconciliation job found {{ $value }} user(s) present in
            Keycloak but absent from the FreeCloud database for at least
            30 minutes. Check GET /api/v1/admin/drift for IDs.

      - alert: ReconciliationDriftDB
        expr: freecloud_reconcile_orphans_in_db > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} DB users have no Keycloak record"
          description: >
            The reconciliation job found {{ $value }} user(s) present in the
            FreeCloud database but absent from Keycloak for at least
            30 minutes. These accounts cannot authenticate.

      - alert: ReconciliationJobStale
        expr: >
          (time() - freecloud_reconcile_last_run_timestamp_seconds) > 3600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Reconciliation job has not run in over 1 hour"
          description: >
            The last successful reconciliation run was more than 1 hour ago.
            The job may be stuck or disabled unexpectedly.

      # ── Leader election (HA) ───────────────────────────────────────────────

      # Fires when every scraped backend reports is_leader=0 for a job label.
      # Does not fire if the metric series is absent (covered by BackendDown).
      - alert: LeaderlessBackgroundJob
        expr: >
          sum by (job) (freecloud_leader_election_is_leader) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No FreeCloud replica is leader for job {{ $labels.job }}"
          description: >
            freecloud_leader_election_is_leader sums to 0 for job
            {{ $labels.job }} for 15 minutes. Background work for that job
            is not running. Check advisory locks, DB pool exhaustion, and
            replica health.

      # ── Review schedule runner ─────────────────────────────────────────────

      # Fires when no leader_ran tick happened in 4x the cadence window.
      # A healthy runner increments freecloud_review_schedule_ticks_total
      # with outcome="leader_ran" on every interval tick.
      - alert: ReviewScheduleRunnerStalled
        expr: >
          (
            increase(freecloud_review_schedule_ticks_total{outcome="leader_ran"}[15m])
          ) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Review schedule runner has not executed a tick in 30 minutes"
          description: >
            freecloud_review_schedule_ticks_total{outcome="leader_ran"} did not
            increase over the last 30 minutes. Due access-review campaigns are
            not being created. Check StartReviewScheduleRunner wiring, the
            leader election, and backend logs.

      # Fires when the runner skips ticks because no replica holds leadership.
      # A small skip rate is normal in multi-replica; a 100% skip rate for
      # >1h means either no leader or a broken isLeader() gate.
      - alert: ReviewScheduleRunnerSkipping
        expr: >
          (
            sum by (job) (
              increase(freecloud_review_schedule_ticks_total{outcome="skipped_not_leader"}[15m])
            )
          ) > 0
            and
            (
              sum by (job) (
                increase(freecloud_review_schedule_ticks_total{outcome="leader_ran"}[15m])
              )
            ) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Review schedule runner only skipping — no replica runs it"
          description: >
            For job {{ $labels.job }}, every tick for the last hour was
            outcome="skipped_not_leader" with zero leader_ran ticks. No
            replica holds leadership (or the isLeader() gate is broken).
            Campaign firing is stalled.

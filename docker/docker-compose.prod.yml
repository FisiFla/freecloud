# Production stack for FreeCloud.
#
# USAGE:
#   1. cp .env.prod.example .env.prod && edit it  (only domains + Fleet credentials)
#   2. make prod-secrets-init   (generates .secrets/secrets.env on first boot)
#   3. make prod-up             (sources secrets + brings up the stack)
#
# OR combine steps 2-3: make prod-up  (secrets-init runs automatically first).
#
# Secrets auto-generated into .secrets/secrets.env on first boot (C1):
#   POSTGRES_PASSWORD, KC_ADMIN_PASSWORD, AUTH_SECRET,
#   SCIM_BEARER_TOKEN, SETUP_TOKEN, ACCESS_EVAL_TOKEN, FLEET_WEBHOOK_SECRET,
#   PROVISIONING_MASTER_KEY, REDIS_PASSWORD
# The operator sets NONE of these.
#
# The generated secrets are ALSO written one-per-file under .secrets/files/.
# They are mounted into the containers as Docker secrets (see the `secrets:`
# block at the bottom of this file) and read through the <VAR>_FILE convention
# (the backend supports it natively — backend/internal/config/secrets.go), so
# the values never appear in `docker inspect` or /proc/<pid>/environ. The
# operator-provided FLEET_API_TOKEN travels the same way: set it in
# .secrets/secrets.env (hand-added key) and generate.sh mirrors it to
# .secrets/files/fleet_api_token — it does NOT go in .env.prod.
#
# What the operator MUST set in .env.prod:
#   DASHBOARD_DOMAIN, API_DOMAIN, KC_DOMAIN (+ their https:// URL variants)
#   FLEET_URL
# What the operator MUST set in .secrets/secrets.env (hand-added key):
#   FLEET_API_TOKEN (from the FleetDM instance; required — the backend
#   refuses to start without it)
# Optionally: SMTP_* for email notifications, POSTURE_CHECK_ENABLED.
#
# Caddy auto-provisions TLS. Postgres serves TLS on the internal network.
#
# Release images: FREECLOUD_VERSION (from .env.prod) pins every app image
# (backend/migrate, frontend, keycloak) to a published ghcr.io release tag.
# `make prod-pull` + `make prod-up` then deploys that release without
# compiling on the host; `make prod-build` remains for offline/source builds
# (the `build:` blocks below are kept for that path). Rollback = set
# FREECLOUD_VERSION back to the previous release and re-run prod-pull/prod-up.
#
# Tags are mutable, so a tag alone does not prove WHAT you deployed. Each
# image line below also accepts an optional digest suffix,
# FREECLOUD_{BACKEND,FRONTEND,KEYCLOAK}_DIGEST (e.g.
# FREECLOUD_BACKEND_DIGEST=@sha256:abc... in .env.prod), which pins the
# exact image digest on top of the tag. Unset (the default) keeps plain
# tag behaviour. See docs/DEPLOYMENT.md "Pinning release images by digest"
# for how to read the current digests and when to set these.
#
# Note on the Postgres password in DATABASE_URL:
#   DATABASE_URL here carries NO password: the backend and migrate services
#   get DATABASE_PASSWORD_FILE (the postgres_password Docker secret, the same
#   file the postgres service reads via POSTGRES_PASSWORD_FILE) and the
#   backend injects the file's password into the DSN at config load
#   (backend/internal/config/config.go). Nothing is interpolated from the
#   host environment, so no password ever appears in `docker inspect`.
#   `make prod-up` still sources .secrets/secrets.env before invoking
#   compose (FREECLOUD_VERSION and friends), but a missing POSTGRES_PASSWORD
#   now fails at backend Validate ("secret could not be resolved") / the
#   migrate one-shot ("DATABASE_URL could not be resolved") instead.

# ── Log rotation (every service) ────────────────────────────────────────────
# Without this, json-file logs grow unbounded on the host disk. 10m × 5 caps
# each service at ~50 MB of retained logs.
x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

# ── Resource limits ─────────────────────────────────────────────────────────
# Per-service memory limits below mirror docker/docker-compose.sim.yml (the
# tuned 12 GB VPS simulator): they sum to ≈8.5 GB, leaving headroom on the
# 12 GB target host for the OS, Docker and page cache. Raise them
# proportionally on bigger hosts. Memory ONLY — no cpu limits: CPU
# throttling hurts Keycloak/JVM latency under burst. No reservations: a
# limit is a ceiling against a runaway service, not a scheduling claim.

services:

  # ── Secret generation (C1) ────────────────────────────────────────────────
  secrets-init:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662  # busybox 1.36
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # One-shot generator: keeps only the ownership capabilities it needs to
    # create/chmod the host's .secrets dir when it runs as a different uid
    # than the dir owner (a plain `docker compose up` runs this as root
    # against an operator-owned dir, and vice versa). The script writes only
    # to the mounted /run/freecloud, so the root filesystem is read-only.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    # Run as the host user so the generated 0600 files stay owned by (and
    # readable by) the operator. FREECLOUD_UID/FREECLOUD_GID are exported by
    # the Makefile; a plain `docker compose up` leaves them at 0 (root).
    user: "${FREECLOUD_UID:-0}:${FREECLOUD_GID:-0}"
    volumes:
      - ../.secrets:/run/freecloud
      - ./init-secrets/generate.sh:/generate.sh:ro
    entrypoint: ["/bin/sh", "/generate.sh"]
    restart: "no"

  # ── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    # Built on the host from ./postgres; intentionally not published to GHCR.
    image: freecloud-postgres:local
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 2g }
    security_opt:
      - no-new-privileges:true
    # The entrypoints start as root (TLS cert setup, then gosu to postgres),
    # so they keep exactly the identity/ownership capabilities they need and
    # nothing else. no-new-privileges does not block gosu: dropping from root
    # to postgres via setuid(2) is not a new privilege.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Read-only root: Postgres writes to the pgdata volume, the socket dir
    # and /tmp; the self-signed TLS cert lives on a tmpfs, so it regenerates
    # on every restart (harmless — clients use sslmode=require, not
    # verify-full, so no fingerprint is pinned anywhere).
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
      - /var/lib/postgresql/ssl
    secrets:
      # The official Postgres image reads the password from POSTGRES_PASSWORD_FILE.
      - postgres_password
    environment:
      POSTGRES_USER: freecloud
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: freecloud
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    # First boot runs initdb, whose fsync phase took ~29s on slow disks in the
    # #315/#316 drill lanes. Without a grace period the retry budget expires
    # before postgres accepts connections and every service_healthy dependent
    # (keycloak, migrate, backend) aborts with "dependency failed to start".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freecloud}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    image: ghcr.io/fisifla/freecloud/keycloak:${FREECLOUD_VERSION:-1.7.0}${FREECLOUD_KEYCLOAK_DIGEST:-}
    build:
      context: ..
      dockerfile: docker/Dockerfile.keycloak
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { memory: 3g }
    # The JVM runs as the image's non-root user on a high port: zero
    # capabilities needed. Read-only root with tmpfs for scratch and the
    # Keycloak data dir (transaction logs/tmp only — Postgres is the store
    # of record, so an ephemeral data dir is safe).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /opt/keycloak/data
    command: ["start"]
    secrets:
      - kc_admin_password
      - postgres_password
      - access_eval_token
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Keycloak has no <VAR>_FILE convention of its own: the image entrypoint
      # (docker/keycloak-entrypoint.sh) reads these files and exports the
      # values under the names Keycloak expects. The variables are not
      # prefixed with KC_ on purpose — kc.sh turns every KC_* variable into a
      # CLI option and would reject an unknown one.
      FREECLOUD_KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
      FREECLOUD_KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/postgres_password
      FREECLOUD_ACCESS_EVAL_TOKEN_FILE: /run/secrets/access_eval_token
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: freecloud
      KC_HOSTNAME: ${KC_PUBLIC_URL}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Deliberately NO KC_HEALTH_ENABLED: in Keycloak 26.8 health-enabled is
      # a BUILD option, so setting it here makes `kc.sh start` re-augment at
      # boot — and that rebuild fails on this image (SmallRyeHealthProcessor
      # dies on the posture SPI fat jar's shaded jakarta.json:
      # "JsonProvider ... not a subtype"; reproduced against the published
      # image recipe). Bake it into docker/Dockerfile.keycloak's
      # `kc.sh build` (after fixing the fat-jar shading) before re-adding.
      # Until then the healthcheck below probes the main port, not :9000.
      ACCESS_EVAL_URL: ${ACCESS_EVAL_URL:-http://backend:8080/api/v1/access/evaluate}
      # Device posture enforcement is ON by default in production: a stack that
      # forgets the variable must not silently run without posture checks.
      # Set POSTURE_CHECK_ENABLED=false explicitly to opt out.
      POSTURE_CHECK_ENABLED: ${POSTURE_CHECK_ENABLED:-true}
      # Lets the authenticator tell a production stack from a development one,
      # so it can warn loudly when posture enforcement is off outside dev.
      APP_ENV: production
      # A3: safe to trust X-Forwarded-For here because this service has no
      # `ports:` mapping — Caddy is the only path to Keycloak in this
      # topology. See docs/DEPLOYMENT.md "Reverse Proxy Requirements (SPI
      # Client-IP Forwarding)" before changing this compose file's network
      # exposure.
      TRUST_PROXY: "true"
    # bash /dev/tcp probe (the KC image ships no curl/wget). Proved live
    # against the running stack: GET /realms/master
    # -> HTTP 200 once Keycloak serves (KC_HOSTNAME pins the issuer, not
    # request routing, so Host: localhost is answered). Generous budget:
    # Keycloak's first boot is slow, and a false "unhealthy" strands every
    # service_healthy dependent.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis (B1, v1.7 HA) ───────────────────────────────────────────────────
  # Dedicated to the backend's rate limiter — deliberately NOT shared with any
  # other service, so this budget's isolation doesn't depend on remembering
  # not to add other keys to it later. REDIS_URL is required in production
  # (config.Validate fails closed without it); this is the only Redis the
  # backend is told about. No other service uses Redis: not the frontend, not
  # Keycloak, and nothing in the observability overlay (Prometheus scrapes
  # the backend's /metrics, it does not talk to Redis).
  #
  # Authenticated: REDIS_PASSWORD is generated by secrets-init into the
  # redis_password Docker secret. The backend gets the same file via
  # REDIS_PASSWORD_FILE and injects it into its password-less REDIS_URL at
  # config load. Upgrading deployments generate the secret idempotently on
  # the next secrets-init run (see docs/DEPLOYMENT.md "Redis password").
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499  # redis 7-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256m }
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image ships a `redis` user (uid 999, gid 1000) that owns /data and
    # 6379 needs no bind capability, so zero capabilities are required. Named
    # volumes inherit that ownership from the image, so this works for fresh
    # volumes and for volumes created by earlier root-running releases.
    user: "999:1000"
    read_only: true
    tmpfs:
      - /tmp:uid=999,gid=1000,mode=1777
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    # The password is never on the command line or in an env value (both are
    # visible in `docker inspect`): this wrapper builds a config file from
    # the secret at start and execs redis-server with it.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        {
          echo 'bind 0.0.0.0'
          echo 'protected-mode yes'
          echo 'port 6379'
          echo 'dir /data'
          printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)"
        } > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    healthcheck:
      # REDISCLI_AUTH from the secret file: only this command string (not the
      # value) appears in `docker inspect`, and unlike --pass the value never
      # appears in the container's process list either.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  # ── Migrate (B2, v1.7 HA) ─────────────────────────────────────────────────
  # One-shot job: applies pending schema migrations then exits. backend waits
  # for it to complete successfully, so a rolling deploy never has a replica
  # racing another replica (or this job) to apply the same migration.
  migrate:
    image: ghcr.io/fisifla/freecloud/backend:${FREECLOUD_VERSION:-1.7.0}${FREECLOUD_BACKEND_DIGEST:-}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["migrate"]
    restart: "no"
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 512m }
    # Distroless nonroot image: no shell, no package manager, binds a high
    # port — zero capabilities needed, read-only root with a scratch /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Same Go binary as backend, so the same _FILE secret delivery works:
    # DATABASE_URL carries no password; the password is injected from the
    # postgres_password Docker secret at config load. An unreadable file
    # fails fast with "DATABASE_URL could not be resolved" instead of a
    # confusing "password authentication failed" at connect time.
    secrets:
      - postgres_password
    environment:
      DATABASE_URL: postgres://freecloud@postgres:5432/freecloud?sslmode=require
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/fisifla/freecloud/backend:${FREECLOUD_VERSION:-1.7.0}${FREECLOUD_BACKEND_DIGEST:-}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # backend/cmd/server/main.go drains HTTP with a 30s context after
    # SIGTERM; compose's default 10s grace SIGKILLs it mid-drain on every
    # deploy. 35s = the 30s drain plus margin to log "server stopped".
    stop_grace_period: 35s
    deploy:
      resources:
        limits: { memory: 1g }
    # Distroless nonroot image (see migrate): zero capabilities needed,
    # read-only root with a scratch /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - scim_bearer_token
      - setup_token
      - access_eval_token
      - fleet_api_token
      - fleet_webhook_secret
      - provisioning_master_key
      - kc_admin_password
      - postgres_password
      - redis_password
      - slack_webhook_url
      - device_cookie_secret
      - ldap_bind_password
      - provisioning_master_key_previous
    environment:
      APP_ENV: production
      PORT: "8080"
      # Peers whose X-Forwarded-For may be trusted. TWO services reach the
      # backend (it has no `ports:` mapping): Caddy, which appends the real
      # peer to X-Forwarded-For, and the frontend BFF (INTERNAL_API_URL),
      # which forwards the client chain it received from Caddy on to the
      # backend. The backend trusts every hop inside these CIDRs and takes
      # the right-most untrusted hop as the client, so the range must cover
      # BOTH proxies' container addresses — it does: the compose network is
      # pinned to this same subnet (see `networks:` below), so Caddy and the
      # frontend always get addresses inside it. Without this every request
      # through the proxies shares ONE rate-limit bucket and a single client
      # can rate-limit every tenant (issue #129).
      TRUSTED_PROXY_CIDRS: ${FREECLOUD_SUBNET:-172.30.0.0/24}
      # No password in the DSN: injected from DATABASE_PASSWORD_FILE (the
      # postgres_password Docker secret) at config load — see the header.
      DATABASE_URL: postgres://freecloud@postgres:5432/freecloud?sslmode=require
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      # No password in the URL either: REDIS_PASSWORD_FILE (the same
      # redis_password Docker secret the redis service reads) is injected at
      # config load. Keep REDIS_URL password-less — a password IN the URL
      # would show up in `docker inspect`.
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # Split-horizon (same pattern as docker-compose.localhost.yml):
      # server-side JWKS/Admin/bootstrap calls go over the internal network,
      # NEVER through Caddy — the Caddyfile now 404s /admin/* and
      # /realms/master/* on the public KC vhost, so a public KEYCLOAK_URL
      # would break bootstrap (master-realm login) and every Admin API call.
      # Tokens still carry the public iss (KC_HOSTNAME), hence the issuer
      # override; KC_HOSTNAME is in URL form, so discovery over the
      # internal URL returns the public issuer.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: ${KC_PUBLIC_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-freecloud}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-freecloud-service}
      # KEYCLOAK_CLIENT_SECRET: self-managed by Epic A bootstrap.
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-freecloud-dashboard}
      FLEET_URL: ${FLEET_URL}
      CORS_ORIGIN: ${DASHBOARD_PUBLIC_URL}
      KC_BOOTSTRAP_ADMIN: admin
      # The backend resolves secrets through <VAR>_FILE → <VAR>_VAULT_PATH →
      # plain env (backend/internal/config/secrets.go).
      SCIM_BEARER_TOKEN_FILE: /run/secrets/scim_bearer_token
      SETUP_TOKEN_FILE: /run/secrets/setup_token
      ACCESS_EVAL_TOKEN_FILE: /run/secrets/access_eval_token
      FLEET_API_TOKEN_FILE: /run/secrets/fleet_api_token
      FLEET_WEBHOOK_SECRET_FILE: /run/secrets/fleet_webhook_secret
      KC_BOOTSTRAP_PASSWORD_FILE: /run/secrets/kc_admin_password
      # PROVISIONING_MASTER_KEY is delivered as a mounted secret only. The
      # backend resolves it through config's resolveSecret (_FILE first) and
      # injects the resolved value into the handler layer, so the value never
      # has to be present in the process environment.
      PROVISIONING_MASTER_KEY_FILE: /run/secrets/provisioning_master_key
      # Retired key, decrypt-only, during a rotation (hand-added
      # PROVISIONING_MASTER_KEY_PREVIOUS in .secrets/secrets.env; empty file
      # when no rotation is in progress).
      PROVISIONING_MASTER_KEY_PREVIOUS_FILE: /run/secrets/provisioning_master_key_previous
      # ── Notification channels ────────────────────────────────────────────
      # The email channel is gated on NOTIFY_EMAIL (false by default). SMTP
      # settings saved in-app (Settings → SMTP) win over these env fallbacks.
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_SLACK: ${NOTIFY_SLACK:-false}
      # Secret by file, not by value: the URL lives in .secrets/secrets.env
      # (hand-added SLACK_WEBHOOK_URL line) and generate.sh mirrors it to
      # the slack_webhook_url Docker secret. Optional: an absent value
      # mirrors as an empty file, which keeps meaning "not configured".
      # Upgrade note: a URL previously set in .env.prod is no longer read —
      # move it to .secrets/secrets.env (see docs/DEPLOYMENT.md "Upgrades").
      SLACK_WEBHOOK_URL_FILE: /run/secrets/slack_webhook_url
      NOTIFY_WEBHOOK: ${NOTIFY_WEBHOOK:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # ── Optional device-cookie signing key ───────────────────────────────
      # Dedicated HMAC key for the freecloud-device-id cookie. When empty the
      # backend falls back to FLEET_WEBHOOK_SECRET. Secret by file: set
      # DEVICE_COOKIE_SECRET in .secrets/secrets.env (hand-added key, as
      # before — the source of truth is unchanged) and generate.sh mirrors
      # it to the device_cookie_secret Docker secret; empty keeps meaning
      # "not configured".
      DEVICE_COOKIE_SECRET_FILE: /run/secrets/device_cookie_secret
      # ── Background jobs / federation / SIEM ──────────────────────────────
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-15m}
      SNAPSHOT_INTERVAL: ${SNAPSHOT_INTERVAL:-1h}
      AUDIT_PRUNE_INTERVAL: ${AUDIT_PRUNE_INTERVAL:-0}
      AUDIT_RETAIN_FOR: ${AUDIT_RETAIN_FOR:-0}
      # Secret by file, not by value: set LDAP_BIND_PASSWORD in
      # .secrets/secrets.env (hand-added key) and generate.sh mirrors it to
      # the ldap_bind_password Docker secret. Optional at boot (only needed
      # when creating LDAP federation sources); an absent value mirrors as
      # an empty file, which keeps meaning "not configured".
      # Upgrade note: a password previously set in .env.prod or the shell
      # environment is no longer read — move it to .secrets/secrets.env
      # (see docs/DEPLOYMENT.md "Upgrades").
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      # Comma-separated LDAP hostnames federation sources may point at.
      # Unset = creating or repointing a federation source is refused.
      LDAP_ALLOWED_HOSTS: ${LDAP_ALLOWED_HOSTS:-}
      SIEM_SYSLOG_NET: ${SIEM_SYSLOG_NET:-udp}
      SIEM_SYSLOG_ADDR: ${SIEM_SYSLOG_ADDR:-}
      SIEM_HTTP_URL: ${SIEM_HTTP_URL:-}
      SIEM_HTTP_TOKEN: ${SIEM_HTTP_TOKEN:-}
      # A2 — GeoIP (optional). Set GEOIP_MMDB_HOST_PATH in .env.prod to the
      # host-side path of your operator-downloaded GeoLite2 file (see
      # docs/DEPLOYMENT.md "GeoIP (MaxMind GeoLite2)") and it is bind-mounted
      # read-only at the fixed in-container path below. Leaving
      # GEOIP_MMDB_HOST_PATH unset mounts nothing and GEOIP_MMDB_PATH stays
      # empty, so geo conditions keep failing closed.
      GEOIP_MMDB_PATH: ${GEOIP_MMDB_HOST_PATH:+/etc/freecloud/geoip.mmdb}
    volumes:
      - ${GEOIP_MMDB_HOST_PATH:-/dev/null}:/etc/freecloud/geoip.mmdb:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/fisifla/freecloud/frontend:${FREECLOUD_VERSION:-1.7.0}${FREECLOUD_FRONTEND_DIGEST:-}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into source builds so /api/version can report what is running;
        # pulled release images carry the values from release.yml instead.
        FREECLOUD_VERSION: ${FREECLOUD_VERSION:-1.7.0}
        GIT_SHA: ${GIT_SHA:-source}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { memory: 1536m }
    # Standalone Next.js as the image's `node` user on port 3000: zero
    # capabilities needed, read-only root with a scratch /tmp (the app uses
    # no next/image optimizer cache, so nothing needs to write at runtime).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - auth_secret
    environment:
      NODE_ENV: production
      AUTH_URL: ${DASHBOARD_PUBLIC_URL}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-freecloud-dashboard}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-}
      AUTH_KEYCLOAK_ISSUER: ${KC_PUBLIC_URL}/realms/${KEYCLOAK_REALM:-freecloud}
      # The BFF proxies /api/v1/* to the backend. Inside the compose network
      # that is http://backend:8080 — never the browser-facing URL and never
      # the http://localhost:8080 fallback.
      INTERNAL_API_URL: http://backend:8080
    # Next.js has no <VAR>_FILE convention, so the mounted secret is read into
    # the environment here — that keeps AUTH_SECRET out of `docker inspect`.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        export AUTH_SECRET="$$(cat /run/secrets/auth_secret)"
        exec node server.js
    depends_on:
      - backend

  # ── Caddy (TLS termination) ───────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f  # caddy 2-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256m }
    security_opt:
      - no-new-privileges:true
    # Binding 80/443 is the only privilege Caddy needs; storage goes to the
    # /data and /config volumes, so the root filesystem stays read-only.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      KC_DOMAIN: ${KC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  pgdata:
  redis_data:
  caddy_data:
  caddy_config:

# ── Network ─────────────────────────────────────────────────────────────────
# The project network gets a FIXED subnet so the backend can trust exactly one
# range of peer addresses (TRUSTED_PROXY_CIDRS below). Without a pinned subnet
# Docker picks one from the host's default address pool, which differs between
# hosts and Docker versions — the backend would then either trust nothing
# (every client shares one rate-limit bucket) or trust too much (a client
# could spoof X-Forwarded-For).
#
# Override FREECLOUD_SUBNET if 172.30.0.0/24 collides with a route on your
# host; the backend reads the same variable, so the two stay in step.
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: ${FREECLOUD_SUBNET:-172.30.0.0/24}

# ── Docker secrets ──────────────────────────────────────────────────────────
# Generated by docker/init-secrets/generate.sh (one file per secret). Mounted
# into the containers as /run/secrets/<name> and read through <VAR>_FILE, so
# the values are not visible in `docker inspect` or /proc/<pid>/environ.
secrets:
  postgres_password:
    file: ../.secrets/files/postgres_password
  kc_admin_password:
    file: ../.secrets/files/kc_admin_password
  auth_secret:
    file: ../.secrets/files/auth_secret
  scim_bearer_token:
    file: ../.secrets/files/scim_bearer_token
  access_eval_token:
    file: ../.secrets/files/access_eval_token
  fleet_api_token:
    file: ../.secrets/files/fleet_api_token
  fleet_webhook_secret:
    file: ../.secrets/files/fleet_webhook_secret
  provisioning_master_key:
    file: ../.secrets/files/provisioning_master_key
  setup_token:
    file: ../.secrets/files/setup_token
  redis_password:
    file: ../.secrets/files/redis_password
  # Operator-managed mirrors (empty file when unset = "not configured"):
  slack_webhook_url:
    file: ../.secrets/files/slack_webhook_url
  device_cookie_secret:
    file: ../.secrets/files/device_cookie_secret
  ldap_bind_password:
    file: ../.secrets/files/ldap_bind_password
  provisioning_master_key_previous:
    file: ../.secrets/files/provisioning_master_key_previous

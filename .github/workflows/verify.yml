name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung step must not burn the default six hours of runner time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Fast gate (vet + unit tests + frontend typecheck/build)
        run: make verify
      - name: Docs consistency
        # Catches documented make targets that do not exist and env vars that
        # are documented but never reach a container.
        run: scripts/check-docs-consistency.sh
      - name: Keycloak SPI tests
        run: cd keycloak-authenticator && mvn test
      - name: Race detector
        run: cd backend && go test -race ./...
      # Tooling is pinned to an exact version: @latest makes the build
      # unreproducible and lets a newly published module version execute inside
      # a job that holds GITHUB_TOKEN. Bump these deliberately.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          cd backend && "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          cd backend && "$(go env GOPATH)/bin/govulncheck" ./...
      # npm audit is BLOCKING for high and critical advisories. Keep the
      # dependency tree clean instead of shipping known-vulnerable packages.
      - name: npm audit
        run: cd frontend && npm audit --audit-level=high

  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea  # postgres 16-alpine
        env:
          POSTGRES_USER: freecloud
          POSTGRES_PASSWORD: freecloud
          POSTGRES_DB: freecloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freecloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: DB-backed integration tests
        env:
          TEST_DATABASE_URL: postgres://freecloud:freecloud@localhost:5432/freecloud_test?sslmode=disable
        run: make test-db

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # Release gate: a tag must not publish images unless the Verify workflow's
  # `verify` job succeeded for the exact tagged commit. github.sha is the
  # tag's commit for both tag pushes and a workflow_dispatch run on a tag,
  # so one check-runs lookup covers both. Job-level permissions replace the
  # workflow-level ones for this job, hence contents: read is restated;
  # checks: read is what the check-runs API needs. This job deliberately
  # does not get packages: write.
  verify-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require a successful Verify run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Latest `verify` check run for this commit (re-runs create new
          # check runs; the newest one is the current verdict). Emitting one
          # TSV row per run and sorting keeps this correct across --paginate
          # pages, where --jq would otherwise run once per page.
          latest="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | select(.name == "verify") | [.started_at, .status, (.conclusion // "-")] | @tsv' \
            | sort | tail -n 1 | cut -f2- | tr '\t' ' ')"
          if [ -z "$latest" ]; then
            echo "::error::No Verify workflow 'verify' check run exists for commit ${{ github.sha }}. Refusing to release an unverified commit: push the commit to main (or open/update a PR) and wait for Verify to succeed, then re-tag."
            exit 1
          fi
          echo "Latest 'verify' check run for ${{ github.sha }}: $latest"
          if [ "$latest" != "completed success" ]; then
            echo "::error::Verify has not succeeded for commit ${{ github.sha }} (latest verify check run: $latest). Refusing to release."
            exit 1
          fi

  images:
    needs: verify-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
            build_args: ""
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            build_args: |
              FREECLOUD_VERSION=${{ github.ref_name }}
              GIT_SHA=${{ github.sha }}
          # The Keycloak image carries the posture-check SPI. It is built from
          # the repo root because the Dockerfile also needs the Maven module.
          - name: keycloak
            context: .
            file: docker/Dockerfile.keycloak
            build_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          # Release hygiene (Wave 2 #13): every published image carries an
          # SBOM + SLSA provenance attestation, verifiable with
          # `gh attestation verify oci://<image>`.
          sbom: true
          provenance: mode=max

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # Release gate: a tag must not publish images unless the Verify workflow's
  # `verify` job succeeded for the exact tagged commit. github.sha is the
  # tag's commit for both tag pushes and a workflow_dispatch run on a tag,
  # so one check-runs lookup covers both. Job-level permissions replace the
  # workflow-level ones for this job, hence contents: read is restated;
  # checks: read is what the check-runs API needs. This job deliberately
  # does not get packages: write.
  verify-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require a successful Verify run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Latest `verify` check run for this commit (re-runs create new
          # check runs; the newest one is the current verdict). Emitting one
          # TSV row per run and sorting keeps this correct across --paginate
          # pages, where --jq would otherwise run once per page.
          latest="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | select(.name == "verify") | [.started_at, .status, (.conclusion // "-")] | @tsv' \
            | sort | tail -n 1 | cut -f2- | tr '\t' ' ')"
          if [ -z "$latest" ]; then
            echo "::error::No Verify workflow 'verify' check run exists for commit ${{ github.sha }}. Refusing to release an unverified commit: push the commit to main (or open/update a PR) and wait for Verify to succeed, then re-tag."
            exit 1
          fi
          echo "Latest 'verify' check run for ${{ github.sha }}: $latest"
          if [ "$latest" != "completed success" ]; then
            echo "::error::Verify has not succeeded for commit ${{ github.sha }} (latest verify check run: $latest). Refusing to release."
            exit 1
          fi

  images:
    needs: verify-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
            build_args: ""
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            build_args: |
              FREECLOUD_VERSION=${{ github.ref_name }}
              GIT_SHA=${{ github.sha }}
          # The Keycloak image carries the posture-check SPI. It is built from
          # the repo root because the Dockerfile also needs the Maven module.
          - name: keycloak
            context: .
            file: docker/Dockerfile.keycloak
            build_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          # Release hygiene (Wave 2 #13): every published image carries an
          # SBOM + SLSA provenance attestation, verifiable with
          # `gh attestation verify oci://<image>`.
          sbom: true
          provenance: mode=max

  # Per-tag GitHub Release with generated notes. Creating a release needs
  # contents: write, so this job — and only this job — gets it; the
  # verify-gate job stays read-only (contents/checks: read) and the images
  # job keeps the workflow-level packages: write for pushing images but
  # does not get contents: write. This job in turn does not get
  # packages: write — the images are already pushed by the images job.
  # No checkout needed: every step below is a gh CLI call using GH_TOKEN
  # with GH_REPO for repo context (gh is preinstalled on runners, so no
  # new `uses:` entries either).
  github-release:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for ${{ github.ref_name }} (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          # Idempotent on workflow re-runs: an existing release (possibly
          # with operator-edited notes) is left untouched, never overwritten.
          if url="$(gh release view "$tag" --json url --jq .url 2>/dev/null)"; then
            echo "Release for $tag already exists: $url — leaving it untouched."
            exit 0
          fi
          # metadata-action publishes semver {{version}}, i.e. the tag without
          # the leading 'v' (tag v1.7.0 -> image tag 1.7.0).
          version="${tag#v}"
          # GHCR image paths must be lowercase (github.repository preserves
          # the owner's display case, e.g. FisiFla), so lowercase it for the
          # image references below; the API calls keep GH_REPO as-is.
          repo_lc="${GH_REPO,,}"
          notes_file="$(mktemp)"
          # --generate-notes cannot be combined with --notes, so generate the
          # notes first (the API diffs against the previous tag automatically),
          # then append the Images section. Release title stays the gh default
          # (the tag name) for determinism.
          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$tag" --jq .body > "$notes_file"
          {
            echo ""
            echo "## Images"
            echo ""
            echo "Published images for this release (each carries an SBOM + SLSA provenance attestation):"
            echo ""
            echo "- \`ghcr.io/${repo_lc}/backend:${version}\`"
            echo "- \`ghcr.io/${repo_lc}/frontend:${version}\`"
            echo "- \`ghcr.io/${repo_lc}/keycloak:${version}\`"
            echo ""
            echo "Verify an image with \`gh attestation verify oci://ghcr.io/${repo_lc}/backend:${version}\`."
          } >> "$notes_file"
          gh release create "$tag" --verify-tag --notes-file "$notes_file"

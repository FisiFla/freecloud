version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  # The Dockerfiles under docker/ (Keycloak SPI image, Postgres TLS image, the
  # two mocks) and the compose files are not covered by the entries above.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  # The Keycloak authenticator SPI is a Maven module.
  - package-ecosystem: maven
    directory: /keycloak-authenticator
    schedule:
      interval: weekly
